<html lang="ja">
<head>

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">

<style>
  :root {
    --bg-color: #0b0f19;
    --card-bg: #151d2a;
    --input-bg: #1e293b;
    --text-color: #f1f5f9;
    --sub-text: #94a3b8;
    --border-color: #334155;
    --accent-btn: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  body.light-mode {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --input-bg: #f1f5f9;
    --text-color: #0f172a;
    --sub-text: #64748b;
    --border-color: #cbd5e1;
    --accent-btn: linear-gradient(135deg, #4f46e5, #7c3aed);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background-color 0.3s;
  }

  .container {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    box-sizing: border-box;
    position: relative;
  }

  .header-area {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    position: relative;
  }

  .center-header {
    text-align: center;
    width: 100%;
  }

  .icon-banner {
    font-size: 1.1rem;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .title {
    font-size: 1.25rem;
    font-weight: bold;
    color: #818cf8;
    margin: 0;
  }

  /* ︙ ボタンのタップ範囲を確実に確保 */
  .menu-trigger {
    position: absolute;
    right: -8px;
    top: -8px;
    width: 48px;
    height: 48px;
    background: none;
    border: none;
    color: var(--text-color);
    font-size: 1.8rem;
    cursor: pointer;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    top: 45px;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 100000;
    width: 170px;
    overflow: hidden;
  }

  .dropdown-menu button {
    width: 100%;
    padding: 14px;
    border: none;
    background: none;
    color: var(--text-color);
    text-align: left;
    font-size: 0.95rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border-color);
  }

  .dropdown-menu button:last-child {
    border-bottom: none;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label.field-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sub-text);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    height: 90px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    padding: 12px;
    font-size: 1rem;
    box-sizing: border-box;
    resize: vertical;
  }

  .size-row {
    display: flex;
    gap: 12px;
  }

  .size-row > div {
    flex: 1;
  }

  input[type="number"] {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    box-sizing: border-box;
  }

  /* 〇 ラジオボタン選択 */
  .radio-group {
    display: flex;
    gap: 20px;
    background: var(--input-bg);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    justify-content: center;
  }

  .radio-group label {
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent-btn);
    color: white;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    margin-top: 8px;
  }

  .result-area {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .result-area img {
    width: 100%;
    border-radius: 12px;
    display: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .loading {
    display: none;
    color: #818cf8;
    font-size: 0.95rem;
    margin: 15px 0;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.7);
    z-index: 200000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .modal-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    max-height: 70vh;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-area">
    <div class="center-header">
      <div class="icon-banner">☁<br>🌲🏡🌲<br>🌱🌊🌱</div>
      <div class="title">souzounoyumenosekai</div>
    </div>
    <button class="menu-trigger" onclick="toggleMenu(event)" aria-label="メニュー">⋮</button>
    
    <div id="dropdownMenu" class="dropdown-menu">
      <button onclick="doPrint()">🖨️ 印刷</button>
      <button onclick="openHistory()">📜 生成履歴</button>
      <button onclick="toggleTheme()">🌓 ダーク/ライト</button>
    </div>
  </div>

  <div class="form-group">
    <label class="field-label">プロンプト (日本語・他言語OK / 自動英語翻訳)</label>
    <textarea id="prompt" placeholder="例: 綺麗な森の中で遊ぶ子猫、アニメ風"></textarea>
  </div>

  <div class="form-group size-row">
    <div>
      <label class="field-label">幅 (Width)</label>
      <input type="number" id="width" value="512" step="64">
    </div>
    <div>
      <label class="field-label">高さ (Height)</label>
      <input type="number" id="height" value="512" step="64">
    </div>
  </div>

  <div class="form-group">
    <label class="field-label">生成タイプ</label>
    <div class="radio-group">
      <label><input type="radio" name="mediaType" value="image" checked> 〇 画像を作成</label>
      <label><input type="radio" name="mediaType" value="video"> 〇 動画(GIF)を作成</label>
    </div>
  </div>

  <button class="submit-btn" onclick="generateMedia()">生成を開始する</button>

  <div class="result-area">
    <div id="loading" class="loading">⏳ 翻訳＆AI生成中... しばらくお待ちください</div>
    <img id="output-image" src="" alt="生成成果物">
  </div>
</div>

<div id="historyModal" class="modal-overlay" onclick="closeHistory()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 style="margin-top:0;">📜 生成履歴</h3>
    <div id="historyList">履歴はありません</div>
    <button onclick="closeHistory()" style="margin-top:15px; width:100%; padding:10px; border-radius:8px; border:none; background:#334155; color:white;">閉じる</button>
  </div>
</div>

<script>
let genHistory = [];

// 1. 動的にPWA用Web Manifestを自動生成して追加（アプリインストール対応）
(function setupPWA() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1e1b4b';
  ctx.fillRect(0, 0, 512, 512);
  ctx.font = '320px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌲', 256, 280);
  const iconDataUrl = canvas.toDataURL('image/png');

  const manifestObj = {
    name: "souzounoyumenosekai",
    short_name: "souzounoyumenosekai",
    start_url: "./",
    display: "standalone",
    background_color: "#0b0f19",
    theme_color: "#6366f1",
    icons: [
      { src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" },
      { src: iconDataUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" }
    ]
  };

  const stringManifest = JSON.stringify(manifestObj);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestUrl = URL.createObjectURL(blob);
  
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestUrl;
  document.head.appendChild(link);

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
    `;
    const swBlob = new Blob([swCode], {type: 'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
})();

// メニュー操作
function toggleMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('dropdownMenu');
  menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('dropdownMenu');
  if (menu) menu.style.display = 'none';
});

function toggleTheme() {
  document.body.classList.toggle('light-mode');
}

function doPrint() {
  window.print();
}

function openHistory() {
  const list = document.getElementById('historyList');
  if (genHistory.length === 0) {
    list.innerHTML = '<p style="color:var(--sub-text);">履歴はまだありません。</p>';
  } else {
    list.innerHTML = genHistory.map(item => `
      <div style="border-bottom:1px solid var(--border-color); padding:8px 0; font-size:0.85rem;">
        <span style="color:#818cf8;">[${item.type}]</span> ${item.prompt}
      </div>
    `).join('');
  }
  document.getElementById('historyModal').style.display = 'flex';
}

function closeHistory() {
  document.getElementById('historyModal').style.display = 'none';
}
