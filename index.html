<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>souzounoyumenosekai</title>

<!-- アプリアイコン＆Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50' y='35' font-size='30' text-anchor='middle'>☁</text><text x='50' y='65' font-size='28' text-anchor='middle'>🌲🏡🌲</text><text x='50' y='90' font-size='22' text-anchor='middle'>🌱🌊🌱</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50' y='35' font-size='30' text-anchor='middle'>☁</text><text x='50' y='65' font-size='28' text-anchor='middle'>🌲🏡🌲</text><text x='50' y='90' font-size='22' text-anchor='middle'>🌱🌊🌱</text></svg>">

<style>
  :root {
    --bg: #0b0f19;
    --card: #151d2a;
    --input: #1e293b;
    --text: #f1f5f9;
    --sub: #94a3b8;
    --border: #334155;
    --btn-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  body.light-mode {
    --bg: #f8fafc;
    --card: #ffffff;
    --input: #f1f5f9;
    --text: #0f172a;
    --sub: #64748b;
    --border: #cbd5e1;
    --btn-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 12px;
    display: flex;
    justify-content: center;
  }

  .app-container {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    width: 100%;
    max-width: 480px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  /* ヘッダーエリア */
  .header {
    text-align: center;
    position: relative;
    margin-bottom: 16px;
    padding-top: 4px;
  }

  .banner-icon {
    font-size: 1.1rem;
    line-height: 1.3;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }

  .app-title {
    font-size: 1.15rem;
    font-weight: bold;
    color: #818cf8;
    margin: 0;
  }

  /* 「⋮」メニューボタンの反応エリア拡張 */
  .menu-btn {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 44px;
    height: 44px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 1.8rem;
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .menu-dropdown {
    display: none;
    position: absolute;
    top: 40px;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    z-index: 10000;
    width: 160px;
    overflow: hidden;
  }

  .menu-dropdown button {
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text);
    text-align: left;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .menu-dropdown button:last-child {
    border-bottom: none;
  }

  /* 入力フォーム (Colab/Gradioスタイル) */
  .field-group {
    margin-bottom: 14px;
  }

  .field-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sub);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    height: 90px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    padding: 10px;
    font-size: 0.95rem;
    resize: vertical;
  }

  .size-flex {
    display: flex;
    gap: 10px;
  }

  .size-flex > div { flex: 1; }

  input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input);
    color: var(--text);
    font-size: 0.95rem;
  }

  /* 新機能：ラジオボタン選択 */
  .radio-container {
    display: flex;
    gap: 16px;
    background: var(--input);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    justify-content: center;
  }

  .radio-container label {
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Colab風生成ボタン */
  .btn-submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--btn-grad);
    color: #ffffff;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    margin-top: 6px;
  }

  .btn-submit:active {
    opacity: 0.85;
  }

  /* 生成結果 */
  .output-area {
    margin-top: 16px;
    text-align: center;
  }

  .output-area img {
    width: 100%;
    border-radius: 10px;
    display: none;
    margin-top: 10px;
    border: 1px solid var(--border);
  }

  .loading-status {
    display: none;
    color: #818cf8;
    font-size: 0.9rem;
    padding: 12px;
  }

  /* 履歴ダイアログ */
  .modal {
    display: none;
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.7);
    z-index: 20000;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .modal-inner {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    width: 100%;
    max-width: 380px;
    max-height: 75vh;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="banner-icon">☁<br>🌲🏡🌲<br>🌱🌊🌱</div>
    <div class="app-title">souzounoyumenosekai</div>
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="メニュー">⋮</button>
    
    <div id="dropdownMenu" class="menu-dropdown">
      <button onclick="doPrint()">🖨️ 印刷</button>
      <button onclick="showHistory()">📜 生成履歴</button>
      <button onclick="toggleTheme()">🌓 ダーク/ライト</button>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">プロンプト (日本語・英語どちらも可 / 自動翻訳)</label>
    <textarea id="prompt" placeholder="例: 神秘的な森の中に建つ小さな家、美しいアニメ調"></textarea>
  </div>

  <div class="field-group size-flex">
    <div>
      <label class="field-label">幅 (Width)</label>
      <input type="number" id="width" value="512" step="64">
    </div>
    <div>
      <label class="field-label">高さ (Height)</label>
      <input type="number" id="height" value="512" step="64">
    </div>
  </div>

  <div class="field-group">
    <label class="field-label">生成モード</label>
    <div class="radio-container">
      <label><input type="radio" name="mediaType" value="image" checked> 〇 画像を作成</label>
      <label><input type="radio" name="mediaType" value="video"> 〇 動画(GIF)を作成</label>
    </div>
  </div>

  <button class="btn-submit" onclick="startGeneration()">生成を開始する</button>

  <div class="output-area">
    <div id="loading" class="loading-status">⏳ 翻訳およびAI生成を行っています...</div>
    <img id="resultImage" src="" alt="生成画像">
  </div>
</div>

<div id="historyModal" class="modal" onclick="closeHistory()">
  <div class="modal-inner" onclick="event.stopPropagation()">
    <h3 style="margin-top:0;">📜 生成履歴</h3>
    <div id="historyContent">履歴はありません</div>
    <button onclick="closeHistory()" style="margin-top:14px; width:100%; padding:8px; border-radius:6px; border:none; background:var(--border); color:var(--text);">閉じる</button>
  </div>
</div>

<script>
let genLogs = [];

// メニューの開閉
function toggleMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('dropdownMenu');
  menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
}

document.addEventListener('click', () => {
  const menu = document.getElementById('dropdownMenu');
  if (menu) menu.style.display = 'none';
});

function toggleTheme() {
  document.body.classList.toggle('light-mode');
}

function doPrint() {
  window.print();
}

function showHistory() {
  const container = document.getElementById('historyContent');
  if (genLogs.length === 0) {
    container.innerHTML = '<p style="color:var(--sub);">履歴はまだありません。</p>';
  } else {
    container.innerHTML = genLogs.map(item => `
      <div style="border-bottom:1px solid var(--border); padding:8px 0; font-size:0.85rem;">
        <span style="color:#818cf8;">[${item.type}]</span> ${item.text}
      </div>
    `).join('');
  }
  document.getElementById('historyModal').style.display = 'flex';
}

function closeHistory() {
  document.getElementById('historyModal').style.display = 'none';
}

// 翻訳処理
async function translatePrompt(text) {
  if (/^[a-zA-Z0-9\s,.-]+$/.test(text)) return text;
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ja|en`);
    const data = await res.json();
    return data.responseData.translatedText || text;
  } catch (err) {
    return text;
  }
}

// 生成メインロジック
async function startGeneration() {
  const promptInput = document.getElementById('prompt').value.trim();
  if (!promptInput) {
    alert('プロンプト（説明文）を入力してください');
    return;
  }

  const loading = document.getElementById('loading');
  const img = document.getElementById('resultImage');
  const w = document.getElementById('width').value || 512;
  const h = document.getElementById('height').value || 512;
  const type = document.querySelector('input[name="mediaType"]:checked').value;

  loading.style.display = 'block';
  img.style.display = 'none';

  const translatedText = await translatePrompt(promptInput);
  const seed = Math.floor(Math.random() * 9999999);

  let targetUrl = '';
  if (type === 'video') {
    const query = encodeURIComponent(translatedText + ', motion animation gif');
    targetUrl = `https://image.pollinations.ai/prompt/${query}?width=${w}&height=${h}&seed=${seed}&nologo=true`;
  } else {
    const query = encodeURIComponent(translatedText);
    targetUrl = `https://image.pollinations.ai/prompt/${query}?width=${w}&height=${h}&seed=
