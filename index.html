<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>想像の夢の世界</title>

<!-- アプリアイコン設定 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50' y='35' font-size='30' text-anchor='middle'>☁</text><text x='50' y='65' font-size='28' text-anchor='middle'>🌲🏡🌲</text><text x='50' y='90' font-size='22' text-anchor='middle'>🌱🌊🌱</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><text x='50' y='35' font-size='30' text-anchor='middle'>☁</text><text x='50' y='65' font-size='28' text-anchor='middle'>🌲🏡🌲</text><text x='50' y='90' font-size='22' text-anchor='middle'>🌱🌊🌱</text></svg>">

<style>
  :root {
    --bg-color: #0b0f19;
    --card-bg: #151d2a;
    --input-bg: #1e293b;
    --text-color: #f1f5f9;
    --sub-text: #94a3b8;
    --border-color: #334155;
    --accent-btn: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  body.light-mode {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --input-bg: #f1f5f9;
    --text-color: #0f172a;
    --sub-text: #64748b;
    --border-color: #cbd5e1;
    --accent-btn: linear-gradient(135deg, #4f46e5, #7c3aed);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 12px;
    display: flex;
    justify-content: center;
  }

  .container {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  /* ヘッダー */
  .header {
    text-align: center;
    position: relative;
    margin-bottom: 16px;
  }

  .icon-banner {
    font-size: 1.1rem;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .title {
    font-size: 1.25rem;
    font-weight: bold;
    color: #818cf8;
    margin: 0;
  }

  /* ︙ ボタンの判定拡大・最前面配置 */
  .menu-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 50px;
    height: 50px;
    background: transparent;
    border: none;
    color: var(--text-color);
    font-size: 2rem;
    cursor: pointer;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    top: 42px;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    z-index: 1000000;
    width: 160px;
    overflow: hidden;
  }

  .dropdown-menu button {
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text-color);
    text-align: left;
    font-size: 0.9rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border-color);
  }

  .dropdown-menu button:last-child {
    border-bottom: none;
  }

  /* 入力フォーム */
  .form-group {
    margin-bottom: 14px;
  }

  label.field-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--sub-text);
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    height: 90px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    padding: 10px;
    font-size: 0.95rem;
    resize: vertical;
  }

  .size-row {
    display: flex;
    gap: 10px;
  }

  .size-row > div { flex: 1; }

  input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: var(--text-color);
    font-size: 0.95rem;
  }

  /* 新機能：画像/動画切り替え */
  .radio-group {
    display: flex;
    gap: 16px;
    background: var(--input-bg);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    justify-content: center;
  }

  .radio-group label {
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 生成ボタン */
  .submit-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent-btn);
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    margin-top: 6px;
  }

  .submit-btn:active {
    opacity: 0.85;
  }

  /* 結果表示 */
  .result-area {
    margin-top: 16px;
    text-align: center;
  }

  .result-area img {
    width: 100%;
    border-radius: 10px;
    display: none;
    margin-top: 10px;
    border: 1px solid var(--border-color);
  }

  .loading {
    display: none;
    color: #818cf8;
    font-size: 0.9rem;
    padding: 12px;
  }

  /* 履歴ダイアログ */
  .modal-overlay {
    display: none;
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.7);
    z-index: 2000000;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .modal-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px;
    width: 100%;
    max-width: 380px;
    max-height: 75vh;
    overflow-y: auto;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="icon-banner">☁<br>🌲🏡🌲<br>🌱🌊🌱</div>
    <div class="title">想像の夢の世界</div>
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="メニュー">⋮</button>
    
    <div id="dropdownMenu" class="dropdown-menu">
      <button onclick="doPrint()">🖨️ 印刷</button>
      <button onclick="openHistory()">📜 生成履歴</button>
      <button onclick="toggleTheme()">🌓 ダーク/ライト</button>
    </div>
  </div>

  <div class="form-group">
    <label class="field-label">プロンプト (日本語・英語どちらも可 / 自動翻訳)</label>
    <textarea id="prompt" placeholder="例: 神秘的な森の中に建つ小さな家、美しいアニメ調"></textarea>
  </div>

  <div class="form-group size-row">
    <div>
      <label class="field-label">幅 (Width)</label>
      <input type="number" id="width" value="512" step="64">
    </div>
    <div>
      <label class="field-label">高さ (Height)</label>
      <input type="number" id="height" value="512" step="64">
    </div>
  </div>

  <div class="form-group">
    <label class="field-label">生成モード</label>
    <div class="radio-group">
      <label><input type="radio" name="mediaType" value="image" checked> 〇 画像を作成</label>
      <label><input type="radio" name="mediaType" value="video"> 〇 動画(GIF)を作成</label>
    </div>
  </div>

  <button class="submit-btn" onclick="generateMedia()">生成を開始する</button>

  <div class="result-area">
    <div id="loading" class="loading">⏳ 翻訳およびAI生成を行っています...</div>
    <img id="output-image" src="" alt="生成成果物">
  </div>
</div>

<div id="historyModal" class="modal-overlay" onclick="closeHistory()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h3 style="margin-top:0;">📜 生成履歴</h3>
    <div id="historyList">履歴はありません</div>
    <button onclick="closeHistory()" style="margin-top:14px; width:100%; padding:8px; border-radius:6px; border:none; background:var(--border-color); color:var(--text-color);">閉じる</button>
  </div>
</div>

<script>
let genHistory = [];

// 「⋮」メニュー切り替え
function toggleMenu(e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  const menu = document.getElementById('dropdownMenu');
  menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
}

document.addEventListener('click', (e) => {
  const menu = document.getElementById('dropdownMenu');
  if (menu && !e.target.classList.contains('menu-btn')) {
    menu.style.display = 'none';
  }
});

function toggleTheme() {
  document.body.classList.toggle('light-mode');
}

function doPrint() {
  window.print();
}

function openHistory() {
  const list = document.getElementById('historyList');
  if (genHistory.length === 0) {
    list.innerHTML = '<p style="color:var(--sub-text);">履歴はまだありません。</p>';
  } else {
    list.innerHTML = genHistory.map(item => `
      <div style="border-bottom:1px solid var(--border-color); padding:8px 0; font-size:0.85rem;">
        <span style="color:#818cf8;">[${item.type}]</span> ${item.prompt}
      </div>
    `).join('');
  }
  document.getElementById('historyModal').style.display = 'flex';
}

function closeHistory() {
  document.getElementById('historyModal').style.display = 'none';
}

// 自動翻訳 (MyMemory API)
async function autoTranslate(text) {
  if (/^[a-zA-Z0-9\s,.-]+$/.test(text)) return text;
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ja|en`);
    const data = await res.json();
    if (data.responseData && data.responseData.translatedText) {
      return data.responseData.translatedText;
    }
    return text;
  } catch (e) {
    return text;
  }
}

// 画像・動画生成
async function generateMedia() {
  const rawPrompt = document.getElementById('prompt').value.trim();
  if (!rawPrompt) {
    alert('プロンプトを入力してください');
    return;
  }

  const loading = document.getElementById('loading');
  const img = document.getElementById('output-image');
  const width = document.getElementById('width').value || 512;
  const height = document.getElementById('height').value || 512;
  const mediaType = document.querySelector('input[name="mediaType"]:checked').value;

  loading.style.display = 'block';
  img.style.display = 'none';

  const enPrompt = await autoTranslate(rawPrompt);
  const seed = Math.floor(Math.random() * 10000000);

  let targetUrl = '';
  if (mediaType === 'video') {
    const p = encodeURIComponent(enPrompt + ', animated gif motion');
    targetUrl = `https://image.pollinations.ai/prompt/${p}?width=${width}&height
