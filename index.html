<div class="card">

  <!-- ドロップダウンメニュー -->

    <label>幅 (Width)
      <input type="number" id="width" value="512" step="64">
    </label>
    <label>高さ (Height)
      <input type="number" id="height" value="512" step="64">
    </label>
  </div>

  <!-- 高さや幅の下に〇ラジオボタンで選択 -->

    <label>
      <input type="radio" name="mediaType" value="image" checked> 〇 画像を作成
    </label>

      <input type="radio" name="mediaType" value="video"> 〇 動画(GIF)を作成
    </label>

  <div class="history-content" onclick="event.stopPropagation()">
    <h3>生成履歴</h3>
    <div id="historyList">履歴はありません</div>
    <button onclick="closeHistory()" style="margin-top:10px; width:100%; padding:8px;">閉じる</button>

<script>
let history = [];

function toggleMenu() {
  const menu = document.getElementById('dropdown');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

function toggleTheme() {
  document.body.classList.toggle('light-mode');
  toggleMenu();
}

function printPage() {
  window.print();
  toggleMenu();
}

function showHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<p>履歴はまだありません。</p>';
  } else {
    list.innerHTML = history.map(h => `<div class="history-item"><b>[${h.type}]</b> ${h.prompt}</div>`).join('');
  }
  document.getElementById('historyModal').style.display = 'flex';
  toggleMenu();
}

function closeHistory() {
  document.getElementById('historyModal').style.display = 'none';
}

// 簡易翻訳 API (MyMemory API を利用して日本語から英語へ自動変換)
async function translateToEnglish(text) {
  // すべて半角英数字の場合はそのまま返却
  if (/^[a-zA-Z0-9\s,.-]+$/.test(text)) return text;
  
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ja|en`);
    const data = await res.json();
    return data.responseData.translatedText || text;
  } catch (e) {
    return text;
  }
}

async function generate() {
  const rawPrompt = document.getElementById('prompt').value.trim();
  if (!rawPrompt) {
    alert('説明を入力してください');
    return;
  }

  const loading = document.getElementById('loading');
  const img = document.getElementById('output-image');
  const width = document.getElementById('width').value || 512;
  const height = document.getElementById('height').value || 512;
  const mediaType = document.querySelector('input[name="mediaType"]:checked').value;

  loading.style.display = 'block';
  img.style.display = 'none';

  // 1. 自動翻訳
  const translatedPrompt = await translateToEnglish(rawPrompt);
  
  const seed = Math.floor(Math.random() * 1000000);
  let mediaUrl = '';

  if (mediaType === 'video') {
    // 動画(GIF)風パラメータを追加
    const finalPrompt = encodeURIComponent(translatedPrompt + ' animated motion gif video loop');
    mediaUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=${width}&height=${height}&nologo=true&seed=${seed}&model=flux`;
  } else {
    const finalPrompt = encodeURIComponent(translatedPrompt);
    mediaUrl = `https://image.pollinations.ai/prompt/${finalPrompt}?width=${width}&height=${height}&nologo=true&seed=${seed}`;
  }

  const tempImg = new Image();
  tempImg.src = mediaUrl;
  tempImg.onload = function() {
    img.src = mediaUrl;
    img.style.display = 'block';
    loading.style.display = 'none';
    
    // 履歴に追加
    history.unshift({ prompt: rawPrompt, type: mediaType === 'video' ? '動画' : '画像' });
  };
  tempImg.onerror = function() {
    alert('生成に失敗しました。時間をおいてお試しください。');
    loading.style.display = 'none';
  };
}

  const blob = new Blob([swCode], {
